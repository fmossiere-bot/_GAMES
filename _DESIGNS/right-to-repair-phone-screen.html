<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 767px; height: 1366px; overflow: hidden; }
  body {
    background: #f4f6f7; color: #0a293b;
    font-family: 'DejaVu Sans', system-ui, sans-serif;
    padding: 38px 34px 0;
    display: flex; flex-direction: column; gap: 26px;
  }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 27px; color: #8b9aa5; font-weight: 600; }
  .bar .dots { display: flex; gap: 6px; }
  .bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: #c3ced5; }
  h1 { font-size: 54px; line-height: 1.15; letter-spacing: -0.01em; font-weight: 700; }
  .search {
    display: flex; align-items: center; gap: 16px;
    background: #fff; border: 2px solid #dbe3e8; border-radius: 20px;
    padding: 26px 28px; box-shadow: 0 3px 10px rgba(10,41,59,0.06);
  }
  .search span { font-size: 36px; color: #0a293b; }
  .caret { width: 3px; height: 30px; background: #e67e22; border-radius: 2px; }
  .label { font-size: 26px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #8b9aa5; }
  .rows { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 20px; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 3px 10px rgba(10,41,59,0.05); }
  .tile { width: 92px; height: 92px; border-radius: 18px; display: grid; place-items: center; flex: none; }
  .t1 { background: rgba(78,138,77,0.14); }
  .t2 { background: rgba(230,126,34,0.14); }
  .t3 { background: rgba(110,198,240,0.18); }
  .lines { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .lines b { display: block; height: 23px; border-radius: 10px; background: #c4d0d8; }
  .lines s { display: block; height: 17px; border-radius: 8px; background: #d8e1e6; }
  .pill { font-size: 25px; font-weight: 800; color: #3f7a3e; background: rgba(78,138,77,0.12); border-radius: 999px; padding: 8px 15px; flex: none; }
  .cta { margin-top: 6px; background: #e67e22; color: #fff; border-radius: 20px; padding: 26px; text-align: center; font-size: 28px; font-weight: 700; }
</style></head>
<body>
  <div class="bar"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>
  <h1>What needs<br>fixing?</h1>
  <div class="search">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8b9aa5" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <span>washing machine</span><div class="caret"></div>
  </div>
  <div class="label">Near you</div>
  <div class="rows">
    <div class="row"><div class="tile t1"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4e8a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="lines"><b style="width:72%"></b><s style="width:52%"></s></div><div class="pill">2 km</div></div>
    <div class="row"><div class="tile t2"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e67e22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div><div class="lines"><b style="width:58%"></b><s style="width:66%"></s></div><div class="pill">5 km</div></div>
    <div class="row"><div class="tile t3"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3f9fd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h.01M7 12h.01M7 16h.01"/></svg></div><div class="lines"><b style="width:66%"></b><s style="width:44%"></s></div><div class="pill">9 km</div></div>
  </div>
</body></html>
